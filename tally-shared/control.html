<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorebug — Control</title>
<style>
  :root { --bg:#15161a; --card:#1e2027; --line:#2c2f3a; --text:#e8e8ea; --sub:#9aa0ad; --accent:#8b5cf6; --p1:#3b82f6; --p2:#e0405f; --p3:#22c55e; --p4:#eab308; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); padding:16px; }
  .wrap { max-width:380px; margin:0 auto; }
  h1 { font-size:15px; margin:0 0 2px; letter-spacing:.02em; }
  .status { font-size:12px; color:var(--sub); display:flex; align-items:center; gap:6px; margin-bottom:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#ef4444; flex:none; }
  .dot.on { background:#22c55e; }
  .mini { padding:3px 8px; font-size:11px; background:#22242c; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; }
  .card h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--sub); margin:0 0 8px; }
  .row { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  .row:last-child { margin-bottom:0; }
  input[type=text] { flex:1; min-width:0; background:#111318; border:1px solid var(--line); color:var(--text); border-radius:7px; padding:8px 10px; font:inherit; }
  input:focus { outline:none; border-color:var(--accent); }
  button { background:#2a2d38; border:1px solid var(--line); color:var(--text); border-radius:7px; padding:8px 10px; font:inherit; cursor:pointer; }
  button:hover { background:#343846; }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.5; cursor:default; }
  .set { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .score { display:flex; align-items:center; gap:8px; }
  .score .val { min-width:34px; text-align:center; font-size:20px; font-variant-numeric:tabular-nums; }
  .bump { width:40px; font-size:16px; font-weight:700; }
  .tag { font-weight:700; font-size:12px; width:26px; }
  .p1 .tag { color:var(--p1); } .p2 .tag { color:var(--p2); }
  .p3 .tag { color:var(--p3); } .p4 .tag { color:var(--p4); }
  .card.hide { display:none; }
  .teams button { flex:1; }
  .teams button.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .flagprev { width:28px; text-align:center; font-size:18px; flex:none; }
  .actions { display:flex; gap:8px; }
  .actions button { flex:1; }
  .danger { border-color:#7f1d1d; } .danger:hover { background:#3a1616; }
  .rosterinfo { font-size:12px; color:var(--sub); flex:1; }
  /* In-page roster suggestions (a <ul role=listbox> under each name box). Not a
     <datalist>: OBS docks/sources are CEF Alloy-style browsers, which never render
     the browser's native datalist/autofill popup — see the roster section below. */
  .ta { flex:1; min-width:0; position:relative; display:flex; }
  .suggest { position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:20; margin:0; padding:4px; list-style:none; background:#1b1d25; border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 28px rgba(0,0,0,.55); max-height:230px; overflow-y:auto; }
  .suggest[hidden] { display:none; }
  .suggest li { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:5px; cursor:pointer; white-space:nowrap; overflow:hidden; }
  .suggest li .fl { width:22px; text-align:center; flex:none; font-size:16px; }
  .suggest li .nm { overflow:hidden; text-overflow:ellipsis; }
  .suggest li.active { background:var(--accent); color:#fff; }
  .suggest li.more { color:var(--sub); font-size:12px; cursor:default; }
  .suggest mark { background:none; color:var(--accent); font-weight:700; }
  .suggest li.active mark { color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Scorebug &mdash; Control</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting&hellip;</span></div>

  <div class="card p1">
    <h2>Player 1</h2>
    <div class="row"><span class="ta"><input type="text" id="p1name" placeholder="Player 1 name" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="p1suggest"><ul class="suggest" id="p1suggest" role="listbox" hidden></ul></span><button class="set" data-set="p1name" data-src="p1name">Set</button></div>
    <div class="row"><input type="text" id="p1flag" placeholder="Flag &mdash; jp, japan, or emoji" autocomplete="off"><span class="flagprev" id="p1flagprev">&mdash;</span><button class="set" data-set="p1flag" data-src="p1flag">Set</button></div>
    <div class="row score"><span class="tag">P1</span><button class="bump" data-cmd="p1-">&minus;</button><span class="val" id="p1score">0</span><button class="bump" data-cmd="p1+">+</button></div>
  </div>

  <div class="card p2">
    <h2>Player 2</h2>
    <div class="row"><span class="ta"><input type="text" id="p2name" placeholder="Player 2 name" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="p2suggest"><ul class="suggest" id="p2suggest" role="listbox" hidden></ul></span><button class="set" data-set="p2name" data-src="p2name">Set</button></div>
    <div class="row"><input type="text" id="p2flag" placeholder="Flag &mdash; jp, japan, or emoji" autocomplete="off"><span class="flagprev" id="p2flagprev">&mdash;</span><button class="set" data-set="p2flag" data-src="p2flag">Set</button></div>
    <div class="row score"><span class="tag">P2</span><button class="bump" data-cmd="p2-">&minus;</button><span class="val" id="p2score">0</span><button class="bump" data-cmd="p2+">+</button></div>
  </div>

  <div class="card p3 hide" id="card-p3">
    <h2>Player 3</h2>
    <div class="row"><span class="ta"><input type="text" id="p3name" placeholder="Player 3 name" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="p3suggest"><ul class="suggest" id="p3suggest" role="listbox" hidden></ul></span><button class="set" data-set="p3name" data-src="p3name">Set</button></div>
    <div class="row"><input type="text" id="p3flag" placeholder="Flag &mdash; jp, japan, or emoji" autocomplete="off"><span class="flagprev" id="p3flagprev">&mdash;</span><button class="set" data-set="p3flag" data-src="p3flag">Set</button></div>
    <div class="row score"><span class="tag">P3</span><button class="bump" data-cmd="p3-">&minus;</button><span class="val" id="p3score">0</span><button class="bump" data-cmd="p3+">+</button></div>
  </div>

  <div class="card p4 hide" id="card-p4">
    <h2>Player 4</h2>
    <div class="row"><span class="ta"><input type="text" id="p4name" placeholder="Player 4 name" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="p4suggest"><ul class="suggest" id="p4suggest" role="listbox" hidden></ul></span><button class="set" data-set="p4name" data-src="p4name">Set</button></div>
    <div class="row"><input type="text" id="p4flag" placeholder="Flag &mdash; jp, japan, or emoji" autocomplete="off"><span class="flagprev" id="p4flagprev">&mdash;</span><button class="set" data-set="p4flag" data-src="p4flag">Set</button></div>
    <div class="row score"><span class="tag">P4</span><button class="bump" data-cmd="p4-">&minus;</button><span class="val" id="p4score">0</span><button class="bump" data-cmd="p4+">+</button></div>
  </div>

  <div class="card">
    <h2>Teams</h2>
    <div class="row teams">
      <button data-teams="2" class="on">2</button>
      <button data-teams="3">3</button>
      <button data-teams="4">4</button>
    </div>
  </div>

  <div class="card">
    <h2>Match</h2>
    <div class="row"><input type="text" id="header" placeholder="Header (e.g. Capcom Cup)" autocomplete="off"><button class="set" data-set="header" data-src="header">Set</button></div>
    <div class="row"><input type="text" id="subheader" placeholder="Subheader (e.g. Grand Finals &middot; FT5)" autocomplete="off"><button class="set" data-set="subheader" data-src="subheader">Set</button></div>
  </div>

  <div class="card">
    <h2>Roster</h2>
    <div class="row"><input type="text" id="rosterUrl" placeholder="Tournament URL (start.gg / Challonge / &hellip;)" autocomplete="off"><button class="set" id="importRoster">Import</button></div>
    <div class="row"><span class="rosterinfo" id="rosterInfo">roster: &mdash;</span><button id="reloadRoster" class="mini" title="Re-read tally-shared/roster.json">Reload</button></div>
  </div>

  <div class="card">
    <div class="actions">
      <button data-cmd="reset" class="danger">Reset scores</button>
      <button data-cmd="swap">Swap players</button>
    </div>
  </div>

</div>

<script src="nations.js"></script>
<script>
// Scorebug control panel. A form-based operator surface that drives the SAME
// "Scoreboard Command" action the chat commands / Stream Deck buttons use — so you can
// type player names, flags, and titles without chat. It speaks Streamer.bot's
// WebSocket directly (no library), sends DoAction requests with { command, value }
// args, and live-reflects state so it stays in sync with chat / Stream Deck edits.
//
// Names autocomplete from tally-shared/roster.json (written by import-roster.mjs or the
// Import button → roster-helper.mjs) via an in-page suggestion list (NOT a native
// <datalist> — OBS docks can't render one, see the roster section). Picking a roster
// player who has a flag auto-fills the flag box (editable before Set — that's the override).
// Setting a name also sends the flag box, so one Set applies both. Edited-but-unset
// fields are "dirty": broadcasts don't overwrite them, and ANY Set click flushes
// every dirty field in one batched DoAction (`setmany`) — edit Player 1 and
// Player 2, click Set once, both land.
//
// Flags accept an ISO code (jp), a nation name/alias (japan, uk, britain…), a flag
// emoji, or none/clear — resolved by nations.js (same table the SB C# action carries).
//
// Serve it from SB's HTTP server via the same `tally-shared` map as panel-core.js, then open
// http://127.0.0.1:7474/tally-shared/control.html . Config: window.__SB_WS_URL or ?sbport=<n>;
// roster helper via window.__ROSTER_HELPER or ?rosterport=<n> (default :7481).
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var WS_URL = window.__SB_WS_URL || (q.get('sbport') ? 'ws://127.0.0.1:' + q.get('sbport') + '/' : 'ws://127.0.0.1:8080/');
  var HELPER = window.__ROSTER_HELPER || 'http://127.0.0.1:' + (q.get('rosterport') || '7481');
  var SYNC_ACTION = 'Scoreboard Push';
  var CMD_ACTION = 'Scoreboard Command';
  var ws = null, id = 0, delay = 1500;
  var rosterPlayers = new Map(); // name → flag emoji | null
  // Text fields with edits the user hasn't Set yet. Broadcasts skip dirty inputs
  // (so setting Player 1 no longer snaps a typed-but-unset Player 2 back to its
  // old value), and any Set click flushes ALL dirty fields in one `setmany`
  // DoAction — edit both players, click either Set, both apply.
  var TEXT_FIELDS = ['p1name', 'p2name', 'p3name', 'p4name', 'p1flag', 'p2flag', 'p3flag', 'p4flag', 'header', 'subheader'];
  var dirty = {}; // field id → true

  function $(id) { return document.getElementById(id); }
  function setStatus(on, text) {
    $('dot').classList.toggle('on', on);
    $('statusText').textContent = text;
  }
  // ONE DoAction per click — never two in a row to the same action. Streamer.bot
  // 1.0.4 bleeds the arguments of DoActions that arrive within a few ms of each
  // other into each other, so a burst silently loses a command. Extra fields ride
  // as siblings of `value` in the same args object instead (see doSet).
  function send(command, value, extra) {
    if (!ws || ws.readyState !== 1) return;
    var args = { command: command };
    if (value !== undefined) args.value = value;
    if (extra) for (var k in extra) args[k] = extra[k];
    ws.send(JSON.stringify({ request: 'DoAction', id: String(++id), action: { name: CMD_ACTION }, args: args }));
  }
  function reflect(elId, val) {
    var el = $(elId);
    if (el && document.activeElement !== el && !dirty[elId]) el.value = (val == null ? '' : val);
  }
  function updatePreview(which) {
    var raw = $(which + 'flag').value;
    var f = window.Nations.resolveFlag(raw);
    $(which + 'flagprev').textContent = f === null ? '?' : (f === '' ? '—' : f);
  }
  function onState(d) {
    if (!d) return;
    for (var i = 1; i <= 4; i++) {
      var p = d['player' + i];
      if (!p) continue;
      $('p' + i + 'score').textContent = p.score;
      reflect('p' + i + 'name', p.name);
      reflect('p' + i + 'flag', p.fields && p.fields.flag);
      updatePreview('p' + i);
    }
    // Teams mode: player3/player4 cards appear only when the broadcast carries
    // them (`teams` is absent on a plain two-team payload).
    var teams = d.teams || 2;
    $('card-p3').classList.toggle('hide', teams < 3);
    $('card-p4').classList.toggle('hide', teams < 4);
    var btns = document.querySelectorAll('button[data-teams]');
    for (var b = 0; b < btns.length; b++) btns[b].classList.toggle('on', Number(btns[b].dataset.teams) === teams);
    reflect('header', d.header); reflect('subheader', d.subheader);
  }

  // ── Roster: in-page typeahead + name→flag autofill ──────────────────────────
  // Suggestions are rendered IN the page (the <ul role=listbox> under each name
  // box), not with <datalist>: OBS custom browser docks and browser sources are CEF
  // *Alloy-style* browsers, and Chromium draws <datalist> suggestions with the
  // browser's own Autofill popup, which Alloy CEF does not implement (CEF issue
  // #906, wontfix) — a datalist works in a Chrome/Firefox tab and shows nothing
  // inside OBS. Typing filters (case/accent-insensitive substring, prefix matches
  // first); ArrowDown on an empty box browses the whole roster; ↑/↓ move; Enter or
  // a click picks; Esc/blur close. A pick writes the value and dispatches `input`,
  // so the flag autofill + dirty tracking below run exactly as for typed text.
  function applyRoster(j) {
    var players = (j && Array.isArray(j.players)) ? j.players
      : (j && Array.isArray(j.names)) ? j.names.map(function (n) { return { name: n, flag: null }; })
      : [];
    rosterPlayers = new Map(players.map(function (p) { return [p.name, p.flag || null]; }));
    var flagged = players.filter(function (p) { return p.flag; }).length;
    $('rosterInfo').textContent = players.length
      ? 'roster: ' + players.length + ' players' + (flagged ? ' (' + flagged + ' flagged)' : '') + (j.tournament ? ' · ' + j.tournament : '')
      : 'roster: none (import a tournament URL above)';
  }
  function loadRoster() {
    fetch('roster.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(applyRoster)
      .catch(function () { $('rosterInfo').textContent = 'roster: none'; });
  }
  function importRoster() {
    var url = $('rosterUrl').value.trim();
    if (!url) { $('rosterInfo').textContent = 'paste a tournament URL first'; return; }
    var btn = $('importRoster');
    btn.disabled = true;
    $('rosterInfo').textContent = 'importing…';
    fetch(HELPER + '/import?url=' + encodeURIComponent(url))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.ok) applyRoster(j.roster);
        else $('rosterInfo').textContent = 'import failed: ' + (j.error || 'unknown error');
      })
      .catch(function () {
        $('rosterInfo').textContent = 'roster helper not running — run `npm run roster` in the bundle folder';
      })
      .then(function () { btn.disabled = false; });
  }
  var MAX_SUGGEST = 200; // Evo-sized brackets: render the first 200, say how many more
  function fold(s) { return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  function wireTypeahead(which) {
    var input = $(which + 'name'), list = $(which + 'suggest');
    var items = [], active = -1, picking = false;
    function close() {
      list.hidden = true; list.textContent = ''; items = []; active = -1;
      input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant');
    }
    function setActive(i) {
      var lis = list.querySelectorAll('li[role="option"]');
      if (active >= 0 && lis[active]) { lis[active].classList.remove('active'); lis[active].setAttribute('aria-selected', 'false'); }
      active = i;
      if (active >= 0 && lis[active]) {
        lis[active].classList.add('active'); lis[active].setAttribute('aria-selected', 'true');
        input.setAttribute('aria-activedescendant', lis[active].id);
        if (lis[active].scrollIntoView) lis[active].scrollIntoView({ block: 'nearest' });
      } else input.removeAttribute('aria-activedescendant');
    }
    function pick(i) {
      var name = items[i]; if (name == null) return;
      close();
      input.value = name;
      picking = true; // our own `input` listener must not reopen the list for a pick
      input.dispatchEvent(new Event('input', { bubbles: true }));
      picking = false;
    }
    function open(browseAll) {
      var q = fold(input.value.trim());
      if (!q && !browseAll) return close();
      var starts = [], contains = [];
      rosterPlayers.forEach(function (flag, n) {
        var at = q ? fold(n).indexOf(q) : 0;
        if (at === 0) starts.push(n); else if (at > 0) contains.push(n);
      });
      var all = starts.concat(contains);
      if (!all.length || (all.length === 1 && all[0] === input.value)) return close();
      items = all.slice(0, MAX_SUGGEST);
      list.textContent = '';
      items.forEach(function (n, i) {
        var li = document.createElement('li');
        li.id = which + 'opt' + i; li.setAttribute('role', 'option'); li.setAttribute('aria-selected', 'false'); li.dataset.i = i;
        var fl = document.createElement('span'); fl.className = 'fl'; fl.textContent = rosterPlayers.get(n) || '';
        li.appendChild(fl);
        // Names come from scraped brackets — build text nodes, never innerHTML.
        var nm = document.createElement('span'); nm.className = 'nm';
        var f = fold(n), at = q ? f.indexOf(q) : -1;
        if (at >= 0 && f.length === n.length) {
          nm.appendChild(document.createTextNode(n.slice(0, at)));
          var m = document.createElement('mark'); m.textContent = n.slice(at, at + q.length); nm.appendChild(m);
          nm.appendChild(document.createTextNode(n.slice(at + q.length)));
        } else nm.textContent = n;
        li.appendChild(nm);
        list.appendChild(li);
      });
      if (all.length > items.length) {
        var more = document.createElement('li'); more.className = 'more'; more.setAttribute('aria-hidden', 'true');
        more.textContent = '\u2026 ' + (all.length - items.length) + ' more \u2014 keep typing';
        list.appendChild(more);
      }
      list.hidden = false; input.setAttribute('aria-expanded', 'true');
      setActive(-1);
    }
    input.addEventListener('input', function () { if (!picking) open(false); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (list.hidden) open(true);
        if (list.hidden) return;
        e.preventDefault();
        var n = items.length, d = e.key === 'ArrowDown' ? 1 : -1;
        setActive(((active + d) % n + n) % n);
      } else if (e.key === 'Enter') {
        if (list.hidden || active < 0) return; // no highlight → the page's Enter = Set shortcut applies
        e.preventDefault(); e.stopPropagation();
        pick(active);
      } else if (e.key === 'Escape') {
        if (!list.hidden) { e.preventDefault(); close(); }
      }
    });
    input.addEventListener('blur', close);
    // mousedown, not click: a click would blur the box first and close the list
    // before it landed. preventDefault keeps focus in the box.
    list.addEventListener('mousedown', function (e) {
      e.preventDefault();
      var li = e.target.closest('li[role="option"]'); if (li) pick(Number(li.dataset.i));
    });
    list.addEventListener('mousemove', function (e) {
      var li = e.target.closest('li[role="option"]');
      if (li && Number(li.dataset.i) !== active) setActive(Number(li.dataset.i));
    });
  }
  // Picking (or typing) an exact roster name auto-fills that player's flag — still
  // editable before Set, which is the override path.
  function wireAutofill(which) {
    $(which + 'name').addEventListener('input', function (e) {
      var flag = rosterPlayers.get(e.target.value);
      if (flag) { $(which + 'flag').value = flag; dirty[which + 'flag'] = true; updatePreview(which); }
    });
  }
  ['p1', 'p2', 'p3', 'p4'].forEach(function (which) {
    wireTypeahead(which);
    wireAutofill(which);
    $(which + 'flag').addEventListener('input', function () { updatePreview(which); });
  });
  // Any user edit marks the field dirty until it's Set (see the `dirty` note above).
  TEXT_FIELDS.forEach(function (f) {
    $(f).addEventListener('input', function () { dirty[f] = true; });
  });

  // ── Streamer.bot connection ──────────────────────────────────────────────────
  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = function () {
      delay = 1500; setStatus(true, 'connected · ' + WS_URL);
      ws.send(JSON.stringify({ request: 'Subscribe', id: String(++id), events: { general: ['Custom'] } }));
      setTimeout(function () {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ request: 'DoAction', id: String(++id), action: { name: SYNC_ACTION }, args: { reason: 'control-connect' } }));
      }, 150);
    };
    ws.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m && m.event && m.event.source === 'General' && m.event.type === 'Custom') {
        var dd = m.data; if (typeof dd === 'string') { try { dd = JSON.parse(dd); } catch (e) {} }
        if (dd && dd.type === 'scoreboard:update') onState(dd);
      }
    };
    ws.onclose = function () { setStatus(false, 'disconnected · retrying'); setTimeout(connect, delay); delay = Math.min(delay * 1.5, 10000); };
    ws.onerror = function () {};
  }

  // ── Controls ────────────────────────────────────────────────────────────────
  // data-cmd = a bare command (score/reset/swap); data-set = a set-* command whose
  // value comes from the input named in data-src. All multi-field sends ride ONE
  // DoAction (companion `flag` arg, or `setmany` sibling args) — never a burst of
  // DoActions, which SB 1.0.4 arg-bleeds: both invocations ran as `p<N>flag`, the
  // name was never written, and the next broadcast snapped the input back to the
  // old name.
  // A Set click flushes the clicked field PLUS every other dirty text field, all in
  // one DoAction (never a burst — see send()). One dirty field → the same single
  // command chat uses; a name + its own flag → the companion-`flag` form (works
  // against the older C# too); anything more → `setmany`, one sibling arg per
  // field, so "edit Player 1 and Player 2, click Set once" applies both.
  function doSet(setCmd, srcId) {
    dirty[srcId] = true; // the clicked field always sends, edited or not
    var companion = /^p[1-4]name$/.test(setCmd) ? setCmd.slice(0, 2) + 'flag' : null;
    if (companion) dirty[companion] = true; // a name Set always carries its flag box
    var fields = TEXT_FIELDS.filter(function (f) { return dirty[f]; });
    var vals = {};
    fields.forEach(function (f) {
      var v = $(f).value;
      // Flags resolve client-side; unresolvable text is sent raw so the SB action
      // logs its own warning and leaves that flag unchanged.
      if (/flag$/.test(f)) { var r = window.Nations.resolveFlag(v); if (r !== null) v = r; }
      vals[f] = v;
      delete dirty[f];
    });
    if (fields.length === 1) { send(fields[0], vals[fields[0]]); return; }
    if (fields.length === 2 && companion && fields.indexOf(companion) >= 0) {
      send(setCmd, vals[setCmd], { flag: vals[companion] });
      return;
    }
    send('setmany', undefined, vals);
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'reloadRoster') { loadRoster(); return; }
    if (b.id === 'importRoster') { importRoster(); return; }
    if (b.dataset.teams) { send('teams', b.dataset.teams); return; }
    if (b.dataset.cmd) send(b.dataset.cmd);
    else if (b.dataset.set) doSet(b.dataset.set, b.dataset.src);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
    if (e.target.id === 'rosterUrl') { importRoster(); return; }
    var setBtn = document.querySelector('button[data-src="' + e.target.id + '"]');
    if (setBtn) doSet(setBtn.dataset.set, setBtn.dataset.src);
  });

  setStatus(false, 'connecting…');
  loadRoster();
  connect();
})();
</script>
</body>
</html>
