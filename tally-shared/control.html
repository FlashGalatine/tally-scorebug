<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorebug — Control</title>
<style>
  :root { --bg:#15161a; --card:#1e2027; --line:#2c2f3a; --text:#e8e8ea; --sub:#9aa0ad; --accent:#8b5cf6; --p1:#3b82f6; --p2:#e0405f; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); padding:16px; }
  .wrap { max-width:380px; margin:0 auto; }
  h1 { font-size:15px; margin:0 0 2px; letter-spacing:.02em; }
  .status { font-size:12px; color:var(--sub); display:flex; align-items:center; gap:6px; margin-bottom:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#ef4444; flex:none; }
  .dot.on { background:#22c55e; }
  .mini { padding:3px 8px; font-size:11px; background:#22242c; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; }
  .card h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--sub); margin:0 0 8px; }
  .row { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  .row:last-child { margin-bottom:0; }
  input[type=text] { flex:1; min-width:0; background:#111318; border:1px solid var(--line); color:var(--text); border-radius:7px; padding:8px 10px; font:inherit; }
  input:focus { outline:none; border-color:var(--accent); }
  button { background:#2a2d38; border:1px solid var(--line); color:var(--text); border-radius:7px; padding:8px 10px; font:inherit; cursor:pointer; }
  button:hover { background:#343846; }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.5; cursor:default; }
  .set { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .score { display:flex; align-items:center; gap:8px; }
  .score .val { min-width:34px; text-align:center; font-size:20px; font-variant-numeric:tabular-nums; }
  .bump { width:40px; font-size:16px; font-weight:700; }
  .tag { font-weight:700; font-size:12px; width:26px; }
  .p1 .tag { color:var(--p1); } .p2 .tag { color:var(--p2); }
  .flagprev { width:28px; text-align:center; font-size:18px; flex:none; }
  .actions { display:flex; gap:8px; }
  .actions button { flex:1; }
  .danger { border-color:#7f1d1d; } .danger:hover { background:#3a1616; }
  .rosterinfo { font-size:12px; color:var(--sub); flex:1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Scorebug &mdash; Control</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting&hellip;</span></div>

  <div class="card p1">
    <h2>Player 1</h2>
    <div class="row"><input type="text" id="p1name" placeholder="Player 1 name" autocomplete="off" list="roster"><button class="set" data-set="p1name" data-src="p1name">Set</button></div>
    <div class="row"><input type="text" id="p1flag" placeholder="Flag &mdash; jp, japan, or emoji" autocomplete="off"><span class="flagprev" id="p1flagprev">&mdash;</span><button class="set" data-set="p1flag" data-src="p1flag">Set</button></div>
    <div class="row score"><span class="tag">P1</span><button class="bump" data-cmd="p1-">&minus;</button><span class="val" id="p1score">0</span><button class="bump" data-cmd="p1+">+</button></div>
  </div>

  <div class="card p2">
    <h2>Player 2</h2>
    <div class="row"><input type="text" id="p2name" placeholder="Player 2 name" autocomplete="off" list="roster"><button class="set" data-set="p2name" data-src="p2name">Set</button></div>
    <div class="row"><input type="text" id="p2flag" placeholder="Flag &mdash; jp, japan, or emoji" autocomplete="off"><span class="flagprev" id="p2flagprev">&mdash;</span><button class="set" data-set="p2flag" data-src="p2flag">Set</button></div>
    <div class="row score"><span class="tag">P2</span><button class="bump" data-cmd="p2-">&minus;</button><span class="val" id="p2score">0</span><button class="bump" data-cmd="p2+">+</button></div>
  </div>

  <div class="card">
    <h2>Match</h2>
    <div class="row"><input type="text" id="header" placeholder="Header (e.g. Capcom Cup)" autocomplete="off"><button class="set" data-set="header" data-src="header">Set</button></div>
    <div class="row"><input type="text" id="subheader" placeholder="Subheader (e.g. Grand Finals &middot; FT5)" autocomplete="off"><button class="set" data-set="subheader" data-src="subheader">Set</button></div>
  </div>

  <div class="card">
    <h2>Roster</h2>
    <div class="row"><input type="text" id="rosterUrl" placeholder="Tournament URL (start.gg / Challonge / &hellip;)" autocomplete="off"><button class="set" id="importRoster">Import</button></div>
    <div class="row"><span class="rosterinfo" id="rosterInfo">roster: &mdash;</span><button id="reloadRoster" class="mini" title="Re-read tally-shared/roster.json">Reload</button></div>
  </div>

  <div class="card">
    <div class="actions">
      <button data-cmd="reset" class="danger">Reset scores</button>
      <button data-cmd="swap">Swap players</button>
    </div>
  </div>

  <datalist id="roster"></datalist>
</div>

<script src="nations.js"></script>
<script>
// Scorebug control panel. A form-based operator surface that drives the SAME
// "Scoreboard Command" action the chat commands / Stream Deck buttons use — so you can
// type player names, flags, and titles without chat. It speaks Streamer.bot's
// WebSocket directly (no library), sends DoAction requests with { command, value }
// args, and live-reflects state so it stays in sync with chat / Stream Deck edits.
//
// Names autocomplete from tally-shared/roster.json (written by import-roster.mjs or the
// Import button → roster-helper.mjs) via a native <datalist>. Picking a roster player
// who has a flag auto-fills the flag box (editable before Set — that's the override).
// Setting a name also sends the flag box, so one Set applies both.
//
// Flags accept an ISO code (jp), a nation name/alias (japan, uk, britain…), a flag
// emoji, or none/clear — resolved by nations.js (same table the SB C# action carries).
//
// Serve it from SB's HTTP server via the same `tally-shared` map as panel-core.js, then open
// http://127.0.0.1:7474/tally-shared/control.html . Config: window.__SB_WS_URL or ?sbport=<n>;
// roster helper via window.__ROSTER_HELPER or ?rosterport=<n> (default :7481).
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var WS_URL = window.__SB_WS_URL || (q.get('sbport') ? 'ws://127.0.0.1:' + q.get('sbport') + '/' : 'ws://127.0.0.1:8080/');
  var HELPER = window.__ROSTER_HELPER || 'http://127.0.0.1:' + (q.get('rosterport') || '7481');
  var SYNC_ACTION = 'Scoreboard Push';
  var CMD_ACTION = 'Scoreboard Command';
  var ws = null, id = 0, delay = 1500;
  var rosterPlayers = new Map(); // name → flag emoji | null

  function $(id) { return document.getElementById(id); }
  function setStatus(on, text) {
    $('dot').classList.toggle('on', on);
    $('statusText').textContent = text;
  }
  function send(command, value) {
    if (!ws || ws.readyState !== 1) return;
    var args = { command: command };
    if (value !== undefined) args.value = value;
    ws.send(JSON.stringify({ request: 'DoAction', id: String(++id), action: { name: CMD_ACTION }, args: args }));
  }
  function reflect(elId, val) {
    var el = $(elId);
    if (el && document.activeElement !== el) el.value = (val == null ? '' : val);
  }
  function updatePreview(which) {
    var raw = $(which + 'flag').value;
    var f = window.Nations.resolveFlag(raw);
    $(which + 'flagprev').textContent = f === null ? '?' : (f === '' ? '—' : f);
  }
  function onState(d) {
    if (!d) return;
    if (d.player1) {
      $('p1score').textContent = d.player1.score;
      reflect('p1name', d.player1.name);
      reflect('p1flag', d.player1.fields && d.player1.fields.flag);
      updatePreview('p1');
    }
    if (d.player2) {
      $('p2score').textContent = d.player2.score;
      reflect('p2name', d.player2.name);
      reflect('p2flag', d.player2.fields && d.player2.fields.flag);
      updatePreview('p2');
    }
    reflect('header', d.header); reflect('subheader', d.subheader);
  }

  // ── Roster: datalist autocomplete + name→flag autofill ──────────────────────
  function applyRoster(j) {
    var players = (j && Array.isArray(j.players)) ? j.players
      : (j && Array.isArray(j.names)) ? j.names.map(function (n) { return { name: n, flag: null }; })
      : [];
    rosterPlayers = new Map(players.map(function (p) { return [p.name, p.flag || null]; }));
    var dl = $('roster');
    dl.textContent = '';
    players.forEach(function (p) { var o = document.createElement('option'); o.value = p.name; dl.appendChild(o); });
    var flagged = players.filter(function (p) { return p.flag; }).length;
    $('rosterInfo').textContent = players.length
      ? 'roster: ' + players.length + ' players' + (flagged ? ' (' + flagged + ' flagged)' : '') + (j.tournament ? ' · ' + j.tournament : '')
      : 'roster: none (import a tournament URL above)';
  }
  function loadRoster() {
    fetch('roster.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(applyRoster)
      .catch(function () { $('rosterInfo').textContent = 'roster: none'; });
  }
  function importRoster() {
    var url = $('rosterUrl').value.trim();
    if (!url) { $('rosterInfo').textContent = 'paste a tournament URL first'; return; }
    var btn = $('importRoster');
    btn.disabled = true;
    $('rosterInfo').textContent = 'importing…';
    fetch(HELPER + '/import?url=' + encodeURIComponent(url))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.ok) applyRoster(j.roster);
        else $('rosterInfo').textContent = 'import failed: ' + (j.error || 'unknown error');
      })
      .catch(function () {
        $('rosterInfo').textContent = 'roster helper not running — run `npm run roster` in the bundle folder';
      })
      .then(function () { btn.disabled = false; });
  }
  // Picking (or typing) an exact roster name auto-fills that player's flag — still
  // editable before Set, which is the override path.
  function wireAutofill(which) {
    $(which + 'name').addEventListener('input', function (e) {
      var flag = rosterPlayers.get(e.target.value);
      if (flag) { $(which + 'flag').value = flag; updatePreview(which); }
    });
  }
  wireAutofill('p1'); wireAutofill('p2');
  $('p1flag').addEventListener('input', function () { updatePreview('p1'); });
  $('p2flag').addEventListener('input', function () { updatePreview('p2'); });

  // ── Streamer.bot connection ──────────────────────────────────────────────────
  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = function () {
      delay = 1500; setStatus(true, 'connected · ' + WS_URL);
      ws.send(JSON.stringify({ request: 'Subscribe', id: String(++id), events: { general: ['Custom'] } }));
      setTimeout(function () {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ request: 'DoAction', id: String(++id), action: { name: SYNC_ACTION }, args: { reason: 'control-connect' } }));
      }, 150);
    };
    ws.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m && m.event && m.event.source === 'General' && m.event.type === 'Custom') {
        var dd = m.data; if (typeof dd === 'string') { try { dd = JSON.parse(dd); } catch (e) {} }
        if (dd && dd.type === 'scoreboard:update') onState(dd);
      }
    };
    ws.onclose = function () { setStatus(false, 'disconnected · retrying'); setTimeout(connect, delay); delay = Math.min(delay * 1.5, 10000); };
    ws.onerror = function () {};
  }

  // ── Controls ────────────────────────────────────────────────────────────────
  // data-cmd = a bare command (score/reset/swap); data-set = a set-* command whose
  // value comes from the input named in data-src. Setting a NAME also sends that
  // player's flag box (resolved), so an autocomplete pick applies name + flag in one
  // click. Flags are resolved client-side; unresolvable text is sent raw so the SB
  // action logs its own warning and changes nothing.
  function doSet(setCmd, srcId) {
    var v = $(srcId).value;
    if (setCmd === 'p1flag' || setCmd === 'p2flag') {
      var f = window.Nations.resolveFlag(v);
      send(setCmd, f === null ? v : f);
      return;
    }
    send(setCmd, v);
    if (setCmd === 'p1name' || setCmd === 'p2name') {
      var which = setCmd.slice(0, 2);
      var fv = window.Nations.resolveFlag($(which + 'flag').value);
      send(which + 'flag', fv === null ? $(which + 'flag').value : fv);
    }
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'reloadRoster') { loadRoster(); return; }
    if (b.id === 'importRoster') { importRoster(); return; }
    if (b.dataset.cmd) send(b.dataset.cmd);
    else if (b.dataset.set) doSet(b.dataset.set, b.dataset.src);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
    if (e.target.id === 'rosterUrl') { importRoster(); return; }
    var setBtn = document.querySelector('button[data-src="' + e.target.id + '"]');
    if (setBtn) doSet(setBtn.dataset.set, setBtn.dataset.src);
  });

  setStatus(false, 'connecting…');
  loadRoster();
  connect();
})();
</script>
</body>
</html>
